services:
  postgres:
    image: postgres:15-alpine
    container_name: apartment_db
    restart: always
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: StrongPasswd2026!
      POSTGRES_DB: apartment_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: apartment_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@apartment.com
      PGADMIN_DEFAULT_PASSWORD: AdminSecurePass2026!
    ports:
      - "5050:80"
    networks:
      - frontend_net
      - backend_net

  web:
    build:
      context: ./app
    container_name: apartment_web
    restart: always
    environment:
      DATABASE_URL: postgresql://dbuser:StrongPasswd2026!@postgres:5432/apartment_db
    depends_on:
      - postgres
    networks:
      - frontend_net
      - backend_net

  nginx:
    image: nginx:alpine
    container_name: apartment_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.crt:/etc/nginx/certs/nginx.crt:ro
      - ./nginx/nginx.key:/etc/nginx/certs/nginx.key:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - frontend_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: apartment_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - frontend_net

  prometheus:
    image: prom/prometheus:latest
    container_name: apartment_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - frontend_net

  loki:
    image: grafana/loki:2.9.2
    container_name: apartment_loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - frontend_net

  promtail:
    image: grafana/promtail:2.9.2
    container_name: apartment_promtail
    restart: always
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - frontend_net

  grafana:
    image: grafana/grafana:latest
    container_name: apartment_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=GrafanaAdmin2026!
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - frontend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true

volumes:
  pgdata:
  nginx_logs:
